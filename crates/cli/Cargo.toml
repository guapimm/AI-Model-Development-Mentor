[package]
name = "code-superman-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Code Superman: codebase understanding as MCP server + CLI"

[[bin]]
name = "code-superman"
path = "src/main.rs"

[dependencies]
code-superman-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "time", "macros"] }
rmcp = { version = "3.1", features = ["server", "macros", "schemars"] }
schemars = "1"
