name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Sync embed content
        run: pwsh -File cli/scripts/sync-embed.ps1

      - name: Build binaries
        run: |
          mkdir -p dist
          cd cli
          go build -trimpath -ldflags "-s -w" -o ../dist/mentor-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/mentor-linux-amd64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/mentor-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/mentor-darwin-arm64 .

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  rust:
    name: Build Rust binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mentor.exe
            asset: mentor-rust-windows-amd64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mentor
            asset: mentor-rust-linux-amd64
          - os: macos-13
            target: x86_64-apple-darwin
            bin: mentor
            asset: mentor-rust-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            bin: mentor
            asset: mentor-rust-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync embed content
        run: pwsh -File cli/scripts/sync-embed.ps1

      - name: Build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp rust/target/${{ matrix.target }}/release/${{ matrix.bin }} rust/${{ matrix.asset }}

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: rust/${{ matrix.asset }}
          fail_on_unmatched_files: false

  mcp:
    name: Pack mentor-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install, sync prompts, pack
        working-directory: mcp
        run: |
          npm ci
          node scripts/sync.mjs
          npm run build
          npm pack

      - name: Upload tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp/guapimm-mentor-mcp-*.tgz
          generate_release_notes: true

      - name: Docker build (verify only, no push)
        working-directory: mcp
        run: docker build -t mentor-mcp:ci .
